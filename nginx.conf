server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { internal; }
    location = /50x.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
